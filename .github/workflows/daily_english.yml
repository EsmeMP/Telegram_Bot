name: Daily English Bot

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  send-lesson:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run English bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python bot.py

      # guarda el historial de palabras en el repo
      - name: Save word history
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_words.txt
          COUNT=$(wc -l < used_words.txt)
          VERSION=$(printf "%04d" $COUNT)
          git diff --cached --quiet || git commit -m "v${VERSION} update word history"
          git push