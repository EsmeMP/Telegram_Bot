# .github/workflows/daily_english.yml
# Coloca este archivo en: .github/workflows/daily_english.yml

name: Daily English Bot

on:
  schedule:
    # Corre todos los días a las 8:00 AM hora de México (UTC-6 = 14:00 UTC)
    - cron: '0 14 * * *'

  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:

jobs:
  send-lesson:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run English bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
        run: python bot.py